 for(let q=D.pens.length-1;q>=0;q--){const e=D.pens[q];if((e.gk===r.p&&!ro.includes('GK'))||(e.t===r.p&&!ro.some(y=>y!=='GK')))delPen(q,true)}
 render()}
function stp(i,j,k,d){const r=V.D.rows[i][j];r[k]=Math.max(0,(r[k]||0)+d);render()}
function setC(i,j,v){const au=gs(V.D,1-i);V.D.rows[i][j].c=(v===''||+v===au)?null:Math.max(0,+v);render()}
function rmR(i,j){const p=V.D.rows[i][j].p;Object.keys(V.D.aw||{}).forEach(k=>{if(V.D.aw[k]===p)delete V.D.aw[k]});for(let k=V.D.pens.length-1;k>=0;k--){const x=V.D.pens[k];if(x.t===p||x.gk===p)delPen(k,true)}V.D.rows[i].splice(j,1);render()}
function addPen(){const D=V.D,sd=V.ps,t=+$('ptk').value,res=$('pres').value,gk=$('pgk').value?+$('pgk').value:null;
 if(!t){toast('Add a non-GK player to that team first');return}
 if(res==='goal')D.rows[sd].find(r=>r.p===t).g++;
 if(res==='saved'&&gk)D.rows[1-sd].find(r=>r.p===gk).s++;
 D.pens.push({side:sd,t,gk:res==='missed'?null:gk,res});render()}
function delPen(k,q){const D=V.D,x=D.pens[k];
 if(x.res==='goal'){const r=D.rows[x.side].find(r=>r.p===x.t);if(r)r.g=Math.max(0,r.g-1)}
 if(x.res==='saved'&&x.gk){const r=D.rows[1-x.side].find(r=>r.p===x.gk);if(r)r.s=Math.max(0,r.s-1)}
 D.pens.splice(k,1);if(!q)render()}
function saveM(){const D=V.D;if(!D.rows[0].length&&!D.rows[1].length){toast('Add players first');return}
 const m={id:D.eid||Date.now(),date:D.date,tn:D.tn,rows:D.rows,pens:D.pens,aw:D.aw||{}};
 if(D.eid)S.hist[S.hist.findIndex(x=>x.id===D.eid)]=m;else S.hist.unshift(m);
 S.hist.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);V.D=newD();V.v='prev';render();toast('Match saved ✅');commit()}
function cancelM(){V.D=newD();go('home')}
/* ---------- previous matches ---------- */
function summ(m){const C=calc(m);const sc=i=>m.rows[i].filter(r=>r.g).map(r=>P(r.p).name+' ×'+r.g).join(', ')||'no scorers';const b=best(C);
 return `⚽ ${m.tn[0]} ${gs(m,0)}-${gs(m,1)} ${m.tn[1]} (${m.date})\n${m.tn[0]}: ${sc(0)}\n${m.tn[1]}: ${sc(1)}\n${(W=>AW.map(([k,t])=>t+': '+(W[k].p?P(W[k].p).name:'—')).join('\n'))(awards(m))}\n— Scorified`}
function vPrev(){if(!S.hist.length)return '<div class="card mu">No matches saved yet.</div>';
 return S.hist.map(m=>{const op=V.sc===m.id,hd=`<div class="card"><div class="row sp"><b>${esc(m.tn[0])} ${gs(m,0)}–${gs(m,1)} ${esc(m.tn[1])}</b><span class="mu">${m.date}</span></div>`;
  if(!op)return hd+`<button style="width:100%;margin-top:8px" onclick="V.sc=${m.id};render()">📋 Scorecard</button></div>`;
  const C=calc(m),pn=m.pens,n=r=>pn.filter(x=>x.res===r).length,W=awards(m);
  return hd+[0,1].map(i=>`<div style="margin-top:8px"><div class="mu"><b>${esc(m.tn[i])}</b></div>`+C[i].map(o=>`<div class="row sp" style="font-size:13.5px"><span>${esc(P(o.r.p).name)} <span class="tag">${o.pos}</span> ${o.of||o.r.g?'⚽'+o.r.g:''}${o.r.a?' 🅰️'+o.r.a:''} ${o.gk?'🧤'+o.r.s+' · −'+o.c:''}</span>${tag(o.rt)}</div>`).join('')+'</div>').join('')+
  (pn.length?`<div class="mu" style="margin-top:8px">🎯 Penalties: ${n('goal')} scored · ${n('saved')} saved · ${n('missed')} missed</div>`:'')+
  `<div style="margin-top:8px;font-size:13.5px">`+AW.map(([k,t])=>`<div class="row sp"><span>${t}</span><span><b>${W[k].p?esc(P(W[k].p).name):'—'}</b>${W[k].p?` <span class="tag">${W[k].man?'✋ Manual':'🤖 AI'}</span>`:''}</span></div>`).join('')+`</div><div class="row" style="margin-top:8px"><button onclick="V.sc=null;render()">▲ Hide</button>`+(EDIT?`<button onclick="editM(${m.id})">✏️ Edit</button>`:'')+`<button onclick="copyM(${m.id})">📋 Copy</button>`+(EDIT?`<button class="d" onclick="delM(${m.id})">${V.del===m.id?'Tap again to delete':'Delete'}</button>`:'')+`</div>`+
  (V.cp&&V.cp.id===m.id?`<textarea readonly style="width:100%;height:110px;margin-top:8px;background:var(--bg);border:1px solid var(--bd);border-radius:10px">${esc(V.cp.tx)}</textarea>`:'')+'</div>'}).join('')}
function editM(id){const m=S.hist.find(x=>x.id===id);V.D=JSON.parse(JSON.stringify({eid:m.id,date:m.date,tn:m.tn,rows:m.rows,pens:m.pens,aw:m.aw||{}}));go('add')}
function delM(id){if(V.del===id){S.hist=S.hist.filter(x=>x.id!==id);V.del=null;render();commit()}else{V.del=id;render()}}
function copyM(id){const tx=summ(S.hist.find(x=>x.id===id));
 try{navigator.clipboard.writeText(tx).then(()=>toast('Copied!'),()=>{V.cp={id,tx};render()})}catch(e){V.cp={id,tx};render()}}
/* ---------- career ---------- */
const Q=()=>({gkn:0,on:0,n:0,g:0,a:0,s:0,c:0,ps:0,pc:0,cs:0,pg:0,mw:0,mo:0,sm:0,dm:0,gm:0,ys:0,yd:0,yg:0,rt:[]});
function agg(){const A={};S.hist.forEach(m=>{const C=calc(m);C.forEach(a=>a.forEach(o=>{const p=o.r.p,q=A[p]||(A[p]=Q());
 q.n++;q.g+=o.r.g;q.a+=o.r.a||0;q.s+=o.r.s;if(o.of)q.on++;if(o.gk){q.gkn++;q.c+=o.c;q.ps+=o.ps;q.pc+=o.pc;if(o.c===0)q.cs++}
 q.pg+=m.pens.filter(x=>x.t===p&&x.res==='goal').length;if(o.rt==='Match Winning')q.mw++;q.rt.push(PT[o.rt])}));const W=awards(m);[['motm','mo'],['st','sm'],['df','dm'],['gk','gm']].forEach(([k,f])=>{const p=W[k].p;if(p&&A[p])A[p][f]++})});Object.values(mAwards()).forEach(o=>[['st','ys'],['df','yd'],['gk','yg']].forEach(([k,f])=>{const p=o[k].p;if(p&&A[p])A[p][f]++}));return A}
const avg=q=>q&&q.rt.length?q.rt.reduce((a,b)=>a+b,0)/q.rt.length:0;
const perf=q=>q&&q.n?`${RN[Math.round(avg(q))-1]} (${avg(q).toFixed(1)}/5)`:'—';
const E0=Q();
function vCareer(){const A=agg(),ids=Object.keys(S.pl).map(Number).filter(id=>V.cv==='p'||P(id).pos==='GK'||(A[id]&&A[id].gkn>0));
 let h=`<div class="tabs"><button class="${V.cv==='p'?'on':''}" onclick="V.cv='p';V.open=null;render()">Players</button><button class="${V.cv==='k'?'on':''}" onclick="V.cv='k';V.open=null;render()">🧤 Goalkeepers</button></div>`;
 const sp=q=>q.s+q.c?Math.round(100*q.s/(q.s+q.c)):0;
 if(V.cv==='k'){const g=ids.filter(id=>A[id]&&A[id].s+A[id].c).sort((a,b)=>sp(A[b])-sp(A[a]))[0];
  if(g)h+=`<div class="card mu">🏆 Best save %: <b>${esc(P(g).name)} (${sp(A[g])}%)</b></div>`}
 if(!ids.length)return h+'<div class="card mu">No players yet. Players are added when you create a match.</div>';
 h+='<div class="card">'+ids.sort((a,b)=>V.cv==='k'?sp(A[b]||E0)-sp(A[a]||E0):(A[b]?A[b].g:0)-(A[a]?A[a].g:0)||P(a).name.localeCompare(P(b).name)).map(id=>{const p=P(id),q=A[id]||E0,gk=p.pos==='GK'||q.gkn>0,op=V.open===id;
  let r=`<div class="pl"><div class="row sp"><b>${esc(p.name)} <span class="tag">${p.pos}</span></b><button onclick="V.open=${op?'null':id};render()">${op?'Close':'More info'}</button></div>`;
  r+=`<div class="mu">${q.n} matches · ${(q.g>0||!gk)?`⚽ ${q.g} goals`:''}${gk?`${q.g>0||!gk?' · ':''}🧤 ${q.s} saves · ${q.c} conceded${V.cv==='k'?` · pen saved ${q.ps} · pen conceded ${q.pc}`:''}`:''}</div>`;
  if(q.a||p.pos==='Def')r=r.replace(/<\/div>$/,` · 🅰️ ${q.a} assists</div>`);
  if(op){const f=q.rt.slice(-5).map(v=>`<span class="f" style="background:${v>=4?'var(--ac)':v>=3?'#65a30d':v>=2?'#d97706':'var(--rd)'}">${v}</span>`).join('');
   r+=`<div class="grid"><div><b>${q.n}</b>Matches</div><div><b>${q.g}</b>Goals</div><div><b>${q.n?(q.g/q.n).toFixed(2):0}</b>Goals/match</div><div><b>${q.a}</b>Assists</div><div><b>${q.pg}</b>Penalty goals</div>`+(gk?`<div><b>${q.gkn}</b>GK matches</div><div><b>${q.on}</b>Outfield matches</div><div><b>${q.s}</b>Saves</div><div><b>${q.c}</b>Goals conceded</div><div><b>${sp(q)}%</b>Save %</div><div><b>${q.ps}</b>Penalty saves</div><div><b>${q.pc}</b>Penalty conceded</div><div><b>${q.cs}</b>Clean sheets</div>`:'')+`<div><b>${q.mw}</b>Match winning</div></div><div class="mu" style="margin-top:8px"><b>🏅 Awards won</b></div><div class="grid" style="margin-top:4px"><div><b>${q.mo}</b>⭐ Man of the Match</div><div><b>${q.sm}</b>⚽ Striker of the Match</div><div><b>${q.dm}</b>🛡 Defender of the Match</div><div><b>${q.gm}</b>🧤 GK of the Match</div><div><b>${q.ys}</b>Striker of the Month</div><div><b>${q.yd}</b>Defender of the Month</div><div><b>${q.yg}</b>GK of the Month</div></div>
   <div class="mu" style="margin-top:8px">Performance avg: <b>${perf(q)}</b> (AI based)<br>Last 5 matches (5 = best): ${f||'—'}</div>`+
   (EDIT?`<div class="row" style="margin-top:8px"><input type="text" value="${esc(p.name)}" onchange="S.pl[${id}].name=this.value.trim()||S.pl[${id}].name;render();commit()" style="flex:1;min-width:110px"><span class="mu">Main position:</span><select onchange="S.pl[${id}].pos=this.value;render();commit()">${POS.map(x=>`<option ${x===p.pos?'selected':''}>${x}</option>`).join('')}</select>${A[id]?'':`<button class="d" onclick="delPl(${id})">${V.del===id?'Tap again':'Delete'}</button>`}</div>`:'')}
  return r+'</div>'}).join('')+'</div>';return h}
function delPl(id){if(V.D.rows[0].concat(V.D.rows[1]).some(r=>r.p===id)){toast('This player is in the match you are entering');return}
 if(V.del===id){delete S.pl[id];V.del=null;V.open=null;render();commit()}else{V.del=id;render()}}
/* ---------- home ---------- */
function stand(){const t={};S.hist.forEach(m=>[0,1].forEach(i=>{const nm=m.tn[i].trim(),k=nm.toLowerCase(),a=gs(m,i),b=gs(m,1-i),q=t[k]||(t[k]={n:nm,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});q.n=nm;q.p++;q.gf+=a;q.ga+=b;if(a>b){q.w++;q.pts+=3}else if(a<b)q.l++;else{q.d++;q.pts++}}));
 return Object.values(t).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf)}
function vHome(){const g=S.hist.reduce((a,m)=>a+gs(m,0)+gs(m,1),0),dr=V.D.rows[0].length+V.D.rows[1].length;
 let h=(EDIT?`<button class="hb p" onclick="go('add')">${V.D.eid?'✏️ Continue editing match':dr?'➕ Continue new match':'➕ Add new match'}</button>`:'')+
 `<button class="hb" onclick="go('prev')">🗂 Previous matches (${S.hist.length})</button><button class="hb" onclick="go('career')">📈 Player career</button>
 <div class="card"><div class="grid" style="margin:0"><div><b>${S.hist.length}</b>Matches</div><div><b>${g}</b>Goals</div><div><b>${Object.keys(S.pl).length}</b>Players</div></div></div>`;
 if(!S.hist.length)return h+(EDIT?'':'<div class="card mu">No matches yet. Check back soon.</div>');
 const A=agg(),ids=Object.keys(A).map(Number),top=(f,min)=>{let b=null;ids.forEach(id=>{const v=f(A[id]);if(v>=min&&(!b||v>b.v))b={id,v}});return b};
 const L=[['⚽ Top scorer',top(q=>q.g,1),v=>v+' goals'],['🧤 Most saves',top(q=>q.s,1),v=>v+' saves'],['🅰️ Most assists',top(q=>q.a,1),v=>v+' assists'],['⭐ Most MOTM',top(q=>q.mo,1),v=>v+' awards'],['📈 Best avg rating',top(q=>q.n>=2?avg(q):0,.1),v=>v.toFixed(1)+'/5']].filter(x=>x[1]);
 if(L.length)h+=`<div class="card"><h3>🏆 Leaders</h3>`+L.map(([t,b,f])=>`<div class="row sp pl"><span>${t}</span><span><b>${esc(P(b.id).name)}</b> <span class="mu">${f(b.v)}</span></span></div>`).join('')+'</div>';
 h+=moCard();h+=`<div class="card"><h3>📊 Team standings</h3><table class="tb"><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>`+stand().map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q.n)}</td><td>${q.p}</td><td>${q.w}</td><td>${q.d}</td><td>${q.l}</td><td>${q.gf-q.ga}</td><td><b>${q.pts}</b></td></tr>`).join('')+'</table><div class="mu" style="margin-top:6px">Win = 3 points, draw = 1. Teams are grouped by name.</div></div>';return h}
function render(){const ab=$('authbox');if(ADMIN_APP&&!EDIT){if(ab)ab.style.display='block';$('v').innerHTML='';$('back').style.display='none';$('mode').style.display='none';return}else if(ab)ab.style.display='none';const v=V.v==='add'&&!EDIT?'home':V.v,vo=READY&&!EDIT;$('back').style.display=v==='home'?'none':'';
 $('mode').textContent='👀 View only';$('mode').style.display=vo?'':'none';
 $('v').innerHTML=v==='home'?vHome():v==='add'?vAdd():v==='prev'?vPrev():vCareer();
 $('dl').innerHTML=Object.values(S.pl).map(p=>`<option value="${esc(p.name)}">`).join('');
 LS('scorified_view',{v:V.v,cv:V.cv});if(EDIT)LS('scorified_draft',{D:V.D,pl:S.pl,pid:S.pid})}
async function connectCloud(){
 if(!window.supabase||SUPABASE_URL.startsWith('PASTE_')||SUPABASE_ANON_KEY.startsWith('PASTE_')){READY=true;render();const m=$('authMsg');if(m)m.textContent='Setup needed: add your Supabase URL and anon key in this HTML file.';return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const {data:row,error}=await sb.from('scorified_data').select('payload,owner_id').eq('id',1).maybeSingle();
 if(error)throw error; ownerId=row?.owner_id||null;
 if(row&&row.payload&&Object.keys(row.payload).length){S=row.payload;S.ma=S.ma||{};}
 if(ADMIN_APP){
   const {data:{session}}=await sb.auth.getSession();
   if(session)await verifyOwner(session.user);
   sb.auth.onAuthStateChange((_event,session)=>{if(session)verifyOwner(session.user);else{EDIT=false;READY=true;render()}});
 } else {EDIT=false;}
 subscribeLive(); READY=true; render();
 if(ADMIN_APP&&EDIT&&(!row||!row.payload||!Object.keys(row.payload).length)){await sb.from('scorified_data').update({payload:S}).eq('id',1)}
}
async function verifyOwner(user){
 const {data,error}=await sb.from('scorified_data').select('owner_id,payload').eq('id',1).single();
 if(error||!data||data.owner_id!==user.id){EDIT=false;await sb.auth.signOut();READY=true;render();const m=$('authMsg');if(m)m.textContent='This account is not the Scorified owner account.';return}
 ownerId=data.owner_id;EDIT=true;if(data.payload&&Object.keys(data.payload).length)S=data.payload;READY=true;render();
}
async function loginAdmin(){const email=$('authEmail').value.trim(),password=$('authPass').value;const m=$('authMsg');m.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email,password});if(error)m.textContent=error.message;}
async function subscribeLive(){if(!sb)return;if(syncChannel)await sb.removeChannel(syncChannel);syncChannel=sb.channel('scorified-live').on('postgres_changes',{event:'UPDATE',schema:'public',table:'scorified_data',filter:'id=eq.1'},payload=>{if(!EDIT||V.v!=='add'){if(payload.new&&payload.new.payload){S=payload.new.payload;S.ma=S.ma||{};render()}}}).subscribe();syncReady=true;}
(async()=>{try{await connectCloud()}catch(e){READY=true;render();const m=$('authMsg');if(m)m.textContent='Cloud connection error: '+(e.message||e)}})();
 render();
</script></body></html>
